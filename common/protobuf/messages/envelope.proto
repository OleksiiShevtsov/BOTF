syntax = "proto3";

package botf;

import "input.proto";
import "world_state.proto";

// Client → server: player_name optional, object_id unset (0).
// Server → client ack: object_id = bound entity id for this TCP session.
// map_id is NOT here — ClientConnect = login to server, not join GameSession.
// Session map_id → future JoinSession notification (45/47).
message ClientConnect {
  string player_name = 1;
  uint32 object_id = 2;
}

// Wire envelope: SFML TCP sends [uint32 le length][serialized Envelope].
// Message kind = which `body` oneof arm is set (no separate MessageType enum).
message Envelope {
  uint64 sequence = 1;
  oneof body {
    ClientConnect client_connect = 2;
    ClientInput client_input = 3;
    WorldState world_state = 4;
  }
}
