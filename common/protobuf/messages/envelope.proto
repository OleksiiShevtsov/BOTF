syntax = "proto3";

package botf;

import "input.proto";
import "world_state.proto";

// Client → server: player_name optional, object_id unset (no entity).
// Server → client ack: object_id unset until SessionStart; 0 is a valid entity id.
// object_id = bound figure/entity id (NOT TCP client id).
// map_id is NOT here — ClientConnect = login to server, not join GameSession.
message ClientConnect {
  string player_name = 1;
  optional int64 object_id = 2;
}

// Client → server: request to join / find a GameSession (card 45).
// figure_type_id selects content/figures/<id> template for this seat.
message JoinSession {
  int64 figure_type_id = 1;
}

// Server → client: match may begin (client Waiting → Playing).
// object_id = bound entity id for the recipient (seat.index; 0 is valid).
message SessionStart {
  optional int64 object_id = 1;
}

// Wire envelope: SFML TCP sends [uint32 le length][serialized Envelope].
// Message kind = which `body` oneof arm is set (no separate MessageType enum).
message Envelope {
  int64 sequence = 1;
  oneof body {
    ClientConnect client_connect = 2;
    ClientInput client_input = 3;
    WorldState world_state = 4;
    JoinSession join_session = 5;
    SessionStart session_start = 6;
  }
}
